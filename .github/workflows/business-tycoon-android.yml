name: Build Business Tycoon Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "business-tycoon/**"
      - ".github/workflows/business-tycoon-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: business-tycoon
        run: npm install
      - name: Add Android platform and sync game assets
        working-directory: business-tycoon
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: business-tycoon/android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tycoon-debug-apk
          path: business-tycoon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
