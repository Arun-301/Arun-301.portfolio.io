name: Build Business Tycoon 3D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'business-tycoon-3d/**'
      - '.github/workflows/business-tycoon-3d-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install export dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          mkdir -p ~/.config/godot ~/.android build
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure Android export preset
        run: |
          cat > business-tycoon-3d/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Business-Tycoon-3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.arun.business_tycoon3d"
          package/name="Business Tycoon 3D"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/allow_backup=true
          package/backup/keep_on_uninstall=false
          package/backup/restore_any_version=false
          package/permissions/custom=""
          screen/immersive_mode=true
          screen/orientation=0
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          screen/opengl_debug=false
          xr_features/xr_mode=0
          permissions/internet=false
          permissions/access_network_state=false
          permissions/access_wifi_state=false
          permissions/change_wifi_state=false
          permissions/record_audio=false
          permissions/camera=false
          permissions/vibrate=false
          permissions/receive_sms=false
          permissions/send_sms=false
          permissions/read_contacts=false
          permissions/write_contacts=false
          permissions/read_external_storage=false
          permissions/write_external_storage=false
          permissions/manage_external_storage=false
          permissions/access_fine_location=false
          permissions/access_coarse_location=false
          permissions/call_phone=false
          permissions/read_phone_state=false
          permissions/receive_boot_completed=false
          EOF

      - name: Export APK
        run: |
          godot --headless --path business-tycoon-3d --editor --quit --verbose
          godot --headless --path business-tycoon-3d --verbose --export-debug "Android" build/Business-Tycoon-3D.apk
          test -s build/Business-Tycoon-3D.apk
          file build/Business-Tycoon-3D.apk
          ls -lh build/Business-Tycoon-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tycoon-3d-android-apk
          path: build/Business-Tycoon-3D.apk
          if-no-files-found: error
          retention-days: 30
