name: Build Business Tycoon 3D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'business-tycoon-3d/**'
      - '.github/workflows/business-tycoon-3d-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install export dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          mkdir -p ~/.config/godot ~/.android build
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure Android export preset
        run: |
          cat > business-tycoon-3d/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Business-Tycoon-3D.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.arun.business_tycoon3d"
          package/name="Business Tycoon 3D"
          package/signed=true
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          xr_features/xr_mode=0
          EOF

      - name: Verify Android export templates
        run: |
          echo "Godot version:"
          godot --version
          echo "Installed export template directories:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -printf '%p (%s bytes)\\n' 2>/dev/null || true
          echo "Android SDK paths:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$HOME/.local/share/godot/export_templates/4.4.1.stable" || {
            echo "::error::Godot 4.4.1 export template directory is missing."
            exit 1
          }
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          echo "Project export preset:"
          cat business-tycoon-3d/export_presets.cfg

      - name: Export APK
        run: |
          godot --headless --path business-tycoon-3d --editor --quit --verbose
          godot --headless --path business-tycoon-3d --verbose --export-debug "Android" build/Business-Tycoon-3D.apk
          test -s build/Business-Tycoon-3D.apk
          file build/Business-Tycoon-3D.apk
          ls -lh build/Business-Tycoon-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tycoon-3d-android-apk
          path: build/Business-Tycoon-3D.apk
          if-no-files-found: error
          retention-days: 30
