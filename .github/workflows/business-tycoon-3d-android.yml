name: Build Business Tycoon 3D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'business-tycoon-3d/**'
      - '.github/workflows/business-tycoon-3d-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install export dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = ""
          EOF
          mkdir -p build

      - name: Configure Android export preset
        run: |
          cat > business-tycoon-3d/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Business-Tycoon-3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          package/unique_name="com.arun.business_tycoon3d"
          package/name="Business Tycoon 3D"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/orientation=0
          permissions/internet=false
          EOF

      - name: Export APK
        run: |
          godot --headless --path business-tycoon-3d --editor --quit
          godot --headless --path business-tycoon-3d --export-debug "Android" build/Business-Tycoon-3D.apk
          test -s build/Business-Tycoon-3D.apk
          file build/Business-Tycoon-3D.apk
          ls -lh build/Business-Tycoon-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-tycoon-3d-android-apk
          path: build/Business-Tycoon-3D.apk
          if-no-files-found: error
          retention-days: 30
